[project]
name = "htmy-rs"
dynamic = ["version"]
description = "Native accelerator for htmy."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Peter Volf", email = "do.volfp@gmail.com" }]
dependencies = [
    "anyio>=4.7.0,<5",
    "htmy>=0.13.4",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0,<3",
    "poethepoet>=0.46.0",
    "pytest>=9.1.0",
    "pytest-random-order>=1.2.0",
    "ruff>=0.16",
    "trio>=0.33.0",
]

[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "htmy_rs._native"

[tool.mypy]
strict = true
show_error_codes = true
explicit_package_bases = true
mypy_path = "python"

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "--random-order"

[tool.ruff]
line-length = 108
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "dist",
    "target",
]
lint.select = [
    "B", # flake8-bugbear
    "C", # flake8-comprehensions
    "E", # pycodestyle errors
    "F", # pyflakes
    "I", # isort
    "S", # flake8-bandit - we must ignore these rules in tests
    "W", # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101"] # S101: use of assert detected
"tests/test_import_order.py" = ["S603"] # S603: subprocess call

[tool.poe.tasks]
format = "ruff format --check ."
format-fix = "ruff format ."

lint = "ruff check ."
lint-fix = "ruff check . --fix"

type = "mypy ."

check.sequence = ["format", "lint", "type"]
check.ignore_fail = "return_non_zero"

test = "python -m pytest tests"
